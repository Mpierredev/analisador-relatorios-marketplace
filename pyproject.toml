[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "analisador-relatorios-marketplaces"
version = "0.1.0"
description = "Validação, normalização e análise de relatórios de vendas de marketplaces."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Márcio Pierre Santos Monteiro" }]
dependencies = [
  "charset-normalizer>=3.4.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15.0",
  "pandas-stubs>=2.2.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
  "types-openpyxl>=3.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analisador"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "N", "C90", "RUF", "T20", "PT"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "analisador.core.*",
  "analisador.ingestion.*",
  "analisador.adapters.*",
  "analisador.validation.*",
  "analisador.normalization.*",
  "analisador.analytics.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/analisador"]
branch = true
omit = ["src/analisador/ui/*", "src/analisador/export/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85
